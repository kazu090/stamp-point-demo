<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>スタンプ型デジタルデバイス デモ</title>
  <style>
    :root{
      --teal:#14b8b0;
      --teal-dark:#0e7280;
      --bg:#eef8f8;
      --card:#ffffff;
      --line:#d9ebeb;
      --text:#13314a;
      --muted:#648093;
      --accent:#f7c94a;
      --green:#30c266;
      --pink:#ff5f7a;
      --shadow:0 10px 24px rgba(25,74,94,.12);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#e7f7f6 0%,#f8fbfc 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
      color:var(--text);
    }
    .app{
      max-width:430px;
      margin:0 auto;
      min-height:100vh;
      padding:14px 14px 30px;
    }
    .phone{
      background:rgba(255,255,255,.72);
      backdrop-filter: blur(8px);
      min-height:calc(100vh - 28px);
      border:1px solid rgba(255,255,255,.7);
      border-radius:28px;
      box-shadow:0 16px 40px rgba(19,49,74,.14);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .header{
      padding:18px 18px 10px;
      background:linear-gradient(135deg,var(--teal) 0%,#0da1a3 100%);
      color:#fff;
    }
    .header-top{display:flex;align-items:center;gap:10px}
    .logo{
      width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.15)
    }
    .logo img{width:100%;height:100%;object-fit:cover}
    .title{font-size:20px;line-height:1.3;font-weight:800;letter-spacing:.02em;margin:0}
    .sub{font-size:12px;opacity:.92;margin-top:4px}
    .content{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
    .step-chip{
      display:inline-flex;align-items:center;gap:8px;
      background:#e7fbf8;color:var(--teal-dark);border:1px solid #c5efea;
      padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px;
      width:max-content;
    }
    .progress{display:flex;gap:6px;flex-wrap:wrap}
    .dot{height:8px;flex:1 1 18px;background:#dbe9ef;border-radius:999px;min-width:18px}
    .dot.active{background:linear-gradient(90deg,var(--teal),#6fd6c7)}
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:16px;
    }
    .card h2,.card h3{margin:0 0 12px}
    .card h2{font-size:22px;line-height:1.35}
    .card h3{font-size:18px;line-height:1.4}
    .desc{color:var(--muted);font-size:14px;line-height:1.7;margin:0}
    .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    label{font-size:14px;font-weight:700}
    select,input[type="text"]{
      width:100%;border:1.5px solid #cfe1e8;border-radius:14px;padding:14px 14px;font-size:16px;background:#fff;color:var(--text);
    }
    .hint{font-size:12px;color:var(--muted);line-height:1.6}
    .campaign-list{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto;padding-right:4px}
    .campaign-item{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:10px}
    .stamp-no{background:#eaf8f8;color:var(--teal-dark);font-weight:800;border-radius:12px;padding:10px 8px;text-align:center;font-size:13px}
    .btn{
      border:none; border-radius:16px; padding:15px 16px; font-size:16px; font-weight:800; cursor:pointer;
      background:linear-gradient(135deg,var(--teal) 0%, #0ea5a8 100%); color:#fff; box-shadow:0 8px 18px rgba(20,184,176,.26)
    }
    .btn.secondary{background:#fff;color:var(--teal-dark);border:1.5px solid #cbe8e6;box-shadow:none}
    .btn-row{display:flex;gap:10px}
    .summary{display:flex;flex-direction:column;gap:10px}
    .summary-item{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:#f6fbfb;border:1px solid #e0eeee;border-radius:14px;font-size:14px}
    .summary-item strong{font-size:15px}
    .center{display:flex;flex-direction:column;align-items:center;text-align:center}
    .hero-icon{width:120px;height:120px;border-radius:26px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:8px;margin-bottom:12px}
    .hero-icon img{width:100%;height:100%;object-fit:contain}
    .only-text-screen{min-height:380px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
    .only-text-screen .big{font-size:28px;font-weight:900;line-height:1.45}
    .only-text-screen .small{font-size:14px;color:var(--muted)}
    .tap-label{margin-top:14px;text-align:center;font-weight:800;color:var(--teal-dark);font-size:15px}
    .tap-btn{width:100%;margin-top:12px}
    .image-panel{
      padding:14px;border-radius:20px;background:linear-gradient(180deg,#f6ffff 0%,#f9fcfc 100%);
      border:1px solid #dceff0;
    }
    .scene-title{font-size:18px;font-weight:800;margin:0 0 10px}
    .scene-box{
      background:#fff;border:1px solid #dfecef;border-radius:18px;padding:14px;box-shadow:0 8px 18px rgba(28,77,86,.07)
    }
    .stamp-illustration,.line-illustration,.site-illustration,.device-action{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .mock-phone{
      width:210px;max-width:100%;aspect-ratio: 9 / 18;background:#0f172a;border-radius:32px;padding:10px;box-shadow:0 18px 30px rgba(0,0,0,.18);position:relative;
    }
    .mock-phone:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:72px;height:8px;background:#1f2937;border-radius:999px}
    .mock-screen{width:100%;height:100%;background:linear-gradient(180deg,#ecffff 0%,#f5fbff 100%);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
    .pill{padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px;display:inline-block;width:max-content}
    .pill.teal{background:#d8f6f3;color:var(--teal-dark)}
    .pill.green{background:#dcf9e7;color:#147944}
    .pill.pink{background:#ffe1e7;color:#d73b63}
    .fake-field{height:42px;border-radius:12px;background:#fff;border:1px solid #dce8ec}
    .stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .stamp-cell{aspect-ratio:1/1;border-radius:14px;border:1.5px dashed #b7d8dc;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8db9c2;font-weight:900}
    .stamp-cell.filled{background:#fff3f6;border:1.5px solid #ffc7d5;color:var(--pink)}
    .line-circle{width:92px;height:92px;border-radius:50%;background:#30c95f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;box-shadow:0 10px 24px rgba(48,201,95,.28)}
    .caption{font-size:15px;font-weight:800;text-align:center;line-height:1.6}
    .device-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:12px 0}
    .phone-flat{width:220px;height:136px;border-radius:24px;background:linear-gradient(180deg,#dff4ff,#bfe7ff);border:3px solid #18344c;box-shadow:0 12px 22px rgba(0,0,0,.12);transform:rotate(-18deg)}
    .stamp-head{position:absolute;top:14px;width:98px;height:124px;background:transparent}
    .wood{position:absolute;left:14px;right:14px;top:0;height:70px;background:linear-gradient(135deg,#f0d0a0,#efc28f 45%,#e6b67f);border-radius:28px 28px 24px 24px;border:1px solid rgba(120,78,31,.18)}
    .wood:before{content:"";position:absolute;left:10px;right:10px;top:4px;height:14px;border-radius:50%;background:rgba(231,242,255,.85);border:2px solid rgba(138,122,179,.45)}
    .neck{position:absolute;left:31px;right:31px;top:67px;height:22px;background:linear-gradient(180deg,#fafafa,#e7e7e7);border-radius:8px}
    .base{position:absolute;left:12px;right:12px;top:86px;height:34px;background:linear-gradient(180deg,#fdfdfd,#ebebeb);border-radius:18px}
    .rays{position:absolute;right:22px;top:16px;display:flex;gap:8px;transform:rotate(18deg)}
    .ray{width:16px;height:46px;background:#f8c31b;border-radius:999px}
    .ray:nth-child(2){height:40px}.ray:nth-child(3){height:34px}
    .check-card{display:flex;gap:10px;align-items:center;background:#f6fbfb;border-radius:14px;padding:12px}
    .check{width:28px;height:28px;border-radius:50%;background:#dff9ea;color:#20a04d;display:flex;align-items:center;justify-content:center;font-weight:900}
    .footer-nav{padding:14px 16px;border-top:1px solid #e4eff1;background:rgba(255,255,255,.9);display:flex;gap:10px}
    .footer-nav .btn{flex:1}
    .mini{font-size:12px;color:var(--muted)}
    .demo-image-wrap{display:flex;justify-content:center;align-items:center;padding:6px 0}
    .demo-image{width:100%;max-width:290px;border-radius:20px;display:block;box-shadow:0 8px 18px rgba(0,0,0,.08);background:#fff;border:1px solid #e5ecef}
    .demo-image.small{max-width:240px}
  </style>
</head>
<body>
<div class="app">
  <div class="phone">
    <div class="header">
      <div class="header-top">
        <div class="logo"><img src="icon.png" alt="スタンプデバイス"></div>
        <div>
          <h1 class="title">運営側デモサイト</h1>
          <div class="sub">スタンプ型デジタルデバイス 設定＆顧客体験デモ</div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="footer-nav">
      <button class="btn secondary" id="backBtn">戻る</button>
      <button class="btn" id="nextBtn">次へ</button>
    </div>
  </div>
</div>
<script>
const state = {
  step: 0,
  storeName: '金シャチ販売店',
  stampCount: 8,
  campaigns: {}
};

const defaultRewards = {
  4: '50円OFF',
  8: '200円OFF',
  12: '500円OFF',
  16: '700円OFF',
  20: '1000円OFF'
};

const totalSteps = 11;

function ensureCampaigns() {
  for (let i = 1; i <= state.stampCount; i++) {
    if (!state.campaigns[i]) {
      state.campaigns[i] = defaultRewards[i] || '';
    }
  }
  Object.keys(state.campaigns).forEach(k => {
    if (+k > state.stampCount) delete state.campaigns[k];
  });
}
ensureCampaigns();

function stepProgress(current){
  let html = '<div class="progress">';
  for(let i=0;i<totalSteps;i++){
    html += `<div class="dot ${i<=current?'active':''}"></div>`;
  }
  html += '</div>';
  return html;
}

function wrap(stepName, inner){
  return `
    <div class="step-chip">STEP ${state.step+1} / ${totalSteps} ・ ${stepName}</div>
    ${stepProgress(state.step)}
    ${inner}
  `;
}

function storeScreen(){
  return wrap('店舗名選択', `
    <div class="card">
      <h2>店舗名を入力</h2>
      <p class="desc">運営側がデモ設定する店舗名を選びます。</p>
      <div class="form-group" style="margin-top:14px">
        <label for="storeName">店舗名</label>
        <input type="text" id="storeName" value="${escapeHtml(state.storeName)}" placeholder="店舗名を入力">
      </div>
      <div class="check-card">
        <div class="check">✓</div>
        <div>
          <div><strong>想定用途</strong>：来店ポイント / 回遊促進 / LINE会員化</div>
          <div class="mini">あとから店舗名やポイント方式を簡単に変更できます。</div>
        </div>
      </div>
    </div>
  `)
}

function countScreen(){
  const options = Array.from({length:19}, (_,i)=>i+2).map(n=>`<option value="${n}" ${state.stampCount===n?'selected':''}>${n}個</option>`).join('');
  return wrap('スタンプ欄数選択', `
    <div class="card">
      <h2>スタンプ欄数を選択</h2>
      <p class="desc">2個～20個の範囲で選択できます。</p>
      <div class="form-group" style="margin-top:14px">
        <label for="stampCount">スタンプ欄数</label>
        <select id="stampCount">${options}</select>
      </div>
      <div class="scene-box">
        <div class="stamp-grid">
          ${Array.from({length:Math.min(state.stampCount,20)},(_,i)=>`<div class="stamp-cell">${i+1}</div>`).join('')}
        </div>
      </div>
      <div class="hint">※ 選択後、各スタンプ到達時のキャンペーン名を設定します。</div>
    </div>
  `)
}

function campaignScreen(){
  ensureCampaigns();
  const items = Array.from({length:state.stampCount}, (_,i)=>i+1).map(n=>`
    <div class="campaign-item">
      <div class="stamp-no">${n}個目</div>
      <input type="text" data-campaign="${n}" value="${escapeHtml(state.campaigns[n] || '')}" placeholder="キャンペーン名を入力">
    </div>
  `).join('');
  return wrap('キャンペーン名設定', `
    <div class="card">
      <h2>キャンペーン名を記載</h2>
      <p class="desc">選択した数量ごとに設定します。4/8/12/16/20個目には初期値を入れています。</p>
      <div class="campaign-list" style="margin-top:14px">${items}</div>
    </div>
  `)
}

function completeScreen(){
  ensureCampaigns();
  const rewards = Object.entries(state.campaigns)
    .filter(([,v]) => (v || '').trim())
    .map(([k,v])=>`<div class="summary-item"><span>${k}個目</span><strong>${escapeHtml(v)}</strong></div>`)
    .join('') || '<div class="summary-item"><span>設定なし</span><strong>―</strong></div>';

  return wrap('設定完了', `
    <div class="card center">
      <div class="hero-icon"><img src="icon.png" alt="スタンプデバイス"></div>
      <h2>設定完了</h2>
      <p class="desc">下記内容でデモ準備ができました。</p>
    </div>
    <div class="card">
      <div class="summary">
        <div class="summary-item"><span>店舗名</span><strong>${escapeHtml(state.storeName)}</strong></div>
        <div class="summary-item"><span>スタンプ欄数</span><strong>${state.stampCount}個</strong></div>
        ${rewards}
      </div>
    </div>
  `)
}

function registrationIntro(){
  return wrap('顧客登録時', `
    <div class="card only-text-screen">
      <div class="big">顧客登録時<br>タップ(クリック)で進む</div>
      <div class="small">ここからはお客様側の初回登録デモです</div>
    </div>
  `)
}

function registration1(){
  return wrap('登録時1', `
    <div class="image-panel">
      <div class="scene-title">初回登録</div>
      <div class="scene-box">
        <div class="stamp-illustration">
          <div class="demo-image-wrap"><img class="demo-image small" src="tap_get.jpg" alt="初回登録イメージ"></div>
          <div class="caption">初回登録の画像</div>
        </div>
      </div>
      <button class="btn tap-btn" data-action="next">タップ</button>
    </div>
  `)
}

function registration2(){
  return wrap('登録時2', `
    <div class="image-panel">
      <div class="scene-title">LINE追加</div>
      <div class="scene-box">
        <div class="line-illustration">
          <div class="demo-image-wrap"><img class="demo-image small" src="line_add.png" alt="LINE追加イメージ"></div>
          <div class="caption">LINE追加の画像</div>
        </div>
      </div>
      <button class="btn tap-btn" data-action="next">タップ</button>
    </div>
  `)
}

function registration3(){
  return wrap('登録時3', `
    <div class="image-panel">
      <div class="scene-title">スタンプサイト（空）</div>
      <div class="scene-box">
        <div class="site-illustration">
          <div class="demo-image-wrap"><img class="demo-image" src="stamp_empty.jpg" alt="空のスタンプサイト"></div>
          <div class="caption">スタンプサイト（空）の画像</div>
        </div>
      </div>
      <button class="btn tap-btn" data-action="next">タップ</button>
    </div>
  `)
}

function visitIntro(){
  return wrap('顧客来店時', `
    <div class="card only-text-screen">
      <div class="big">顧客来店時<br>タップ(クリック)で進む</div>
      <div class="small">ここからは来店時のポイント加算デモです</div>
    </div>
  `)
}

function visit1(){
  return wrap('来店時1', `
    <div class="image-panel">
      <div class="scene-title">スタンプ動作</div>
      <div class="scene-box">
        <div class="device-action">
          <div class="demo-image-wrap"><img class="demo-image" src="device_action.png" alt="スタンプ動作イメージ"></div>
          <div class="caption">スタンプ動作の画像</div>
        </div>
      </div>
      <button class="btn tap-btn" data-action="next">タップ</button>
    </div>
  `)
}

function visit2(){
  return wrap('来店時2', `
    <div class="image-panel">
      <div class="scene-title">スタンプサイト（スタンプ1つ）</div>
      <div class="scene-box">
        <div class="site-illustration">
          <div class="demo-image-wrap"><img class="demo-image" src="stamp_filled.jpg" alt="スタンプ1つのサイト"></div>
          <div class="caption">スタンプサイト（スタンプ1つ）の画像</div>
        </div>
      </div>
      <button class="btn tap-btn" data-action="next">タップ</button>
    </div>
  `)
}

const screens = [
  storeScreen,
  countScreen,
  campaignScreen,
  completeScreen,
  registrationIntro,
  registration1,
  registration2,
  registration3,
  visitIntro,
  visit1,
  visit2,
];

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function bindEvents(){
  const storeSelect = document.getElementById('storeName');
  if(storeSelect){
    const updateStore = e => state.storeName = e.target.value;
    storeSelect.addEventListener('change', updateStore);
    storeSelect.addEventListener('input', updateStore);
  }
  const countSelect = document.getElementById('stampCount');
  if(countSelect){
    countSelect.addEventListener('change', e=> {
      state.stampCount = Number(e.target.value);
      ensureCampaigns();
      render();
    });
  }
  document.querySelectorAll('[data-campaign]').forEach(el=>{
    el.addEventListener('input', e=> {
      state.campaigns[Number(e.target.dataset.campaign)] = e.target.value;
    })
  });

  document.querySelectorAll('[data-action="next"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(state.step===2){
        document.querySelectorAll('[data-campaign]').forEach(input=> state.campaigns[Number(input.dataset.campaign)] = input.value);
      }
      if(state.step < totalSteps-1) state.step++;
      else state.step = 0;
      render();
    });
  });
}

function render(){
  document.getElementById('content').innerHTML = screens[state.step]();
  document.getElementById('backBtn').disabled = state.step === 0;
  document.getElementById('backBtn').style.opacity = state.step === 0 ? '.5' : '1';
  document.getElementById('nextBtn').textContent = state.step === totalSteps-1 ? '最初に戻る' : '次へ';
  bindEvents();
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  if(state.step>0){ state.step--; render(); }
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(state.step===2){
    document.querySelectorAll('[data-campaign]').forEach(el=> state.campaigns[Number(el.dataset.campaign)] = el.value);
  }
  if(state.step < totalSteps-1) state.step++;
  else state.step = 0;
  render();
});

render();
</script>
</body>
</html>
